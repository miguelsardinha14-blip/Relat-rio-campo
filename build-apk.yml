name: Compilar APK e AAB Android
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar dependências e gerar build web
        run: |
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android
      - name: Gerar APK Debug Instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Baixar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio-Campo-Alto-da-Serra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
